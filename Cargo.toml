[workspace]
resolver = "2"
members = [
    "crates/iec61850-hal",
    "crates/iec61850-asn1",
    "crates/iec61850-tls",
    "crates/iec61850-model",
    "crates/iec61850-mms",
    "crates/iec61850-goose",
    "crates/iec61850-sv",
    "crates/iec61850-scl",
    "crates/iec61850-scl-build",
    "crates/iec61850-scl-build-example",
    "crates/iec61850-client",
    "crates/iec61850-server",
    "crates/iec61850-sntp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Cheng Sin Pang"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/csp0924/iec61850-rust"

[workspace.dependencies]
# Aliases for intra-workspace dependencies.
# `default-features = true` is stated explicitly so that downstream crates can
# select `default-features = false` and reach the no_std path: when a workspace
# alias omits `default-features`, a downstream override is ignored with a
# warning and will become a hard error in a future Cargo release.
iec61850-hal   = { path = "crates/iec61850-hal",   version = "0.1.0", default-features = true }
iec61850-asn1  = { path = "crates/iec61850-asn1",  version = "0.1.0", default-features = true }
iec61850-tls   = { path = "crates/iec61850-tls",   version = "0.1.0" }
iec61850-model = { path = "crates/iec61850-model", version = "0.1.0", default-features = true }
iec61850-mms   = { path = "crates/iec61850-mms",   version = "0.1.0" }
iec61850-goose = { path = "crates/iec61850-goose", version = "0.1.0" }
iec61850-sv    = { path = "crates/iec61850-sv",    version = "0.1.0" }
iec61850-scl   = { path = "crates/iec61850-scl",   version = "0.1.0" }
iec61850-scl-build = { path = "crates/iec61850-scl-build", version = "0.1.0" }
iec61850-sntp  = { path = "crates/iec61850-sntp",  version = "0.1.0" }

# Shared external dependencies. A crate that does not enable one does not build it.
thiserror       = "2"
bytes           = "1"
tokio           = { version = "1", default-features = false }
tracing         = "0.1"
rustls          = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
tokio-rustls    = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
rustls-webpki   = { package = "rustls-webpki", version = "0.103" }
rcgen           = { version = "0.13", default-features = false, features = ["ring", "pem"] }
libc            = "0.2"
# SQLite backend for buffered report control blocks, enabled by the
# `iec61850-server/sqlite-backend` feature. The `bundled` feature compiles the
# SQLite sources so that no system libsqlite3 is required.
rusqlite        = { version = "0.31", default-features = false, features = ["bundled"] }
tempfile        = "3"
# Streaming XML parser behind `iec61850-scl`.
quick-xml       = { version = "0.42", default-features = false, features = ["encoding"] }
# Code generation stack for `iec61850-scl-build`: emits and formats the
# `model.rs` written into OUT_DIR.
proc-macro2     = "1"
quote           = "1"
syn             = { version = "2", default-features = false, features = ["full", "parsing"] }
prettyplease    = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Size-optimized release profile for embedded targets such as the STM32F407.
# Usage: `cargo build --release --profile release-size ...`
[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false
overflow-checks = false
